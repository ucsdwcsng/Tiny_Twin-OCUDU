# EdgeRIC DL MCS override: the edgeric_mcs codeletset (dl_mcs on the mac_sched_dl_mcs_ctrl hook) and the dl_mcs_app muApp (passthrough / fixed / offset MCS per UE).
#
# Adapted from scout-jbpf jrtc-apps/jrtc_apps/edgeric/dl_mcs_deployment.yaml (commit cfd2a6e) for
# ocudu/tiny-twin-test/docker-compose.jrtc.yml: jrtc, jrtc-decoder and jbpf-proxy share one network namespace, so the
# decoder, the app REST API and the gNB's jbpf proxy are all at 127.0.0.1. jrtc-ctl reads "ip" (not scout's k8s
# "host" names, which it ignores). Load from inside the jrtc container, where JRTC_APPS=/apps and
# JBPF_CODELETS=/codelets:
#   jrtc-ctl load -c /apps/edgeric/dl_mcs_deployment.yaml

name: edgeric_mcs

decoder:
  - type: decodergrpc
    ip: 127.0.0.1
    port: 20789

app:
  - name: dl_mcs_app
    path: ${JRTC_APPS}/edgeric/dl_mcs_app.py
    type: python
    ip: 127.0.0.1
    port: 3001
    modules:
      - ${JBPF_CODELETS}/edgeric/dl_mcs_report.py

jbpf:
  device:
    - id: 1
      ip: 127.0.0.1
      port: 30450

  codelet_set:
    - device: 1
      config: ${JBPF_CODELETS}/edgeric/edgeric_mcs.yaml
