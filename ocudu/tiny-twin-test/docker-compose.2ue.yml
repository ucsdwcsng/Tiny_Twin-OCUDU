# gNB + 2 OAI UE(s) through the ZMQ broker. Generated by: gen_multi_ue_compose.py --ues 2
# Layered on docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.2ue.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.2ue.yml down
#
# up builds the broker image only if it is missing; after changing zmq_broker/ run "... build broker" (not
# --build, which also rebuilds the gNB image). UE i uses configs/oaiue{i}_zmq.conf if it existed when this
# file was generated, else configs/oaiue_zmq.conf. Regenerate this file rather than editing it by hand.

services:
  5gc:
    environment:
      SUBSCRIBER_DB: /open5gs/subscriber_db.csv
    volumes:
      - ./open5gs/subscriber_db_2ue.csv:/open5gs/subscriber_db.csv:ro

  gnb:
    configs:
      - gnb_config.yml
      - gnb_compose_config.yml
      - gnb_broker_config.yml
    command: gnb -c /gnb_config.yml -c /gnb_compose_config.yml -c /gnb_broker_config.yml

  broker:
    container_name: ocudu_zmq_broker
    image: tiny-twin-zmq-broker
    build:
      context: ../../zmq_broker
    depends_on:
      gnb:
        condition: service_started
    networks:
      ran:
        ipv4_address: 10.53.1.254
    command:
      - --gnb-tx
      - tcp://10.53.1.3:4556
      - --gnb-rx
      - tcp://0.0.0.0:4557
      - --ue
      - tcp://0.0.0.0:5000,tcp://10.53.1.4:4557
      - --ue
      - tcp://0.0.0.0:5001,tcp://10.53.1.5:4557

  ue:
    command:
      - "-O"
      - "/oaie_zmq.conf"
      - "-C"
      - "3489420000"
      - "-r"
      - "51"
      - "--numerology"
      - "1"
      - "--band"
      - "78"
      - "-E"
      - "--ue-scan-carrier"
      - --uicc0.imsi
      - "001010123456780"
      - --zmq.[0].rx_channels
      - tcp://10.53.1.254:5000

  ue2:
    extends:
      file: docker-compose.yml
      service: ue
    container_name: ocudu_ue2_tinytwin
    depends_on:
      broker:
        condition: service_started
    networks:
      ran:
        ipv4_address: 10.53.1.5
    volumes:
      - ./configs/oaiue2_zmq.conf:/oaie_zmq.conf:ro
    command:
      - "-O"
      - "/oaie_zmq.conf"
      - "-C"
      - "3489420000"
      - "-r"
      - "51"
      - "--numerology"
      - "1"
      - "--band"
      - "78"
      - "-E"
      - "--ue-scan-carrier"
      - --uicc0.imsi
      - "001010123456781"
      - --zmq.[0].rx_channels
      - tcp://10.53.1.254:5001

configs:
  gnb_broker_config.yml:
    content: |
      ru_sdr:
        device_args: tx_port=tcp://0.0.0.0:4556,rx_port=tcp://10.53.1.254:4557,base_srate=23.04e6
